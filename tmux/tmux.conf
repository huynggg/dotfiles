# --- Agent / Neovim essentials ---
set -sg escape-time 10          # Esc responds instantly (Neovim, Claude Code)
set -g history-limit 50000      # scroll back through long Claude output
set -g mouse on                 # scroll and resize panes with the mouse
set -g focus-events on          # lets Neovim notice files Claude changed

# --- Colors ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true color for themes

# --- Clipboard over SSH (OSC 52) ---
set -g set-clipboard on         # yanks in Neovim/tmux reach the Mac clipboard
set -g allow-passthrough on     # lets escape sequences (e.g. bells/notifications) through

# --- Convenience ---
set -g base-index 1             # windows start at 1 (matches keyboard layout)
setw -g pane-base-index 1
set -g renumber-windows on
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
bind s display-popup -E -w 60% -h 60% "sesh connect \"$(sesh list | fzf --reverse)\""
